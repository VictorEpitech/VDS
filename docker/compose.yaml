name: vds
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vds}
      POSTGRES_DB: ${POSTGRES_DB:-vds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    image: ${VDS_SERVER_IMAGE:-vds-server:local}
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      VDS_BASE_PATH: ${VDS_BASE_PATH:-/}
      VDS_AUTH_PROVIDER: ${VDS_AUTH_PROVIDER:-auth.local}
      VDS_THEME: ${VDS_THEME:-theme.vtech}
      VDS_DEFAULT_LOCALE: ${VDS_DEFAULT_LOCALE:-fr}
      VDS_PUBLIC_ORIGIN: ${VDS_PUBLIC_ORIGIN:-}
      VDS_SECRET_KEY: ${VDS_SECRET_KEY:-}
      VDS_BOOTSTRAP_TOKEN: ${VDS_BOOTSTRAP_TOKEN:-}
      VDS_ADMIN_EMAIL: ${VDS_ADMIN_EMAIL:-}
      VDS_ADMIN_PASSWORD: ${VDS_ADMIN_PASSWORD:-}
      VDS_SMTP_HOST: ${VDS_SMTP_HOST:-}
      VDS_SMTP_PORT: ${VDS_SMTP_PORT:-587}
      VDS_SMTP_SECURITY: ${VDS_SMTP_SECURITY:-starttls}
      VDS_SMTP_USERNAME: ${VDS_SMTP_USERNAME:-}
      VDS_SMTP_PASSWORD: ${VDS_SMTP_PASSWORD:-}
      VDS_MAIL_FROM: ${VDS_MAIL_FROM:-}
      # Canal local d'enrôlement (volume partagé avec le service `agent`). Absent en hébergé.
      VDS_LOCAL_AGENT_DIR: /run/vds/local-agent
      # Image affichée dans la commande « autre machine » (privée : vide = vds-agent:<version>).
      VDS_AGENT_IMAGE: ${VDS_AGENT_IMAGE:-}
      VDS_AGENT_PULL_USER: ${VDS_AGENT_PULL_USER:-}
      VDS_AGENT_PULL_TOKEN: ${VDS_AGENT_PULL_TOKEN:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      VDS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vds}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vds}
    volumes:
      - media-data:/data/media
      - local-agent:/run/vds/local-agent
    ports:
      - "${VDS_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;b=os.environ.get('VDS_BASE_PATH','/').rstrip('/');urllib.request.urlopen(f'http://127.0.0.1:8000{b}/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Agent local : en sommeil tant qu'aucun site ne l'a activé depuis l'admin (aucune commande).
  # Réseau hôte (Linux) : Wake-on-LAN en broadcast et, plus tard, ARP/mDNS ne traversent pas
  # le NAT d'un réseau bridge. Aucun port entrant : il joint le serveur par la boucle locale
  # (http://127.0.0.1:${VDS_PORT}${VDS_BASE_PATH}, clair accepté vers loopback seul).
  # Image PRIVÉE : construite localement, jamais tirée de GHCR ; VDS_AGENT_IMAGE reste surchargeable.
  # Même UID (10001) que le serveur : le volume `local-agent` est créé avec ce propriétaire.
  agent:
    image: ${VDS_AGENT_IMAGE:-vds-site-agent:local}
    build:
      context: ..
      dockerfile: docker/site-agent.Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      VDS_AGENT_LOCAL_DIR: /run/vds/local-agent
      VDS_AGENT_DATA_DIR: /data/agent
      VDS_PORT: ${VDS_PORT:-8000}
      VDS_BASE_PATH: ${VDS_BASE_PATH:-/}
      # Serveur derrière un proxy TLS sans port publié : URL complète (préfixe compris).
      VDS_SERVER_URL: ${VDS_LOCAL_AGENT_SERVER_URL:-}
    volumes:
      - local-agent:/run/vds/local-agent
      - agent-data:/data/agent
volumes:
  db-data:
  media-data:
  local-agent:
  agent-data:
