# Surcharge dev (make dev) : code serveur monté, rechargement automatique.
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  server:
    command: ["sh", "-c", "python -m vds_server.migrate && exec uvicorn vds_server.main:app_factory --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/server/src --reload-dir /app/packages/sdk-py/src"]
    volumes:
      - ../apps/server/src:/app/apps/server/src:ro
      - ../packages/sdk-py/src:/app/packages/sdk-py/src:ro
      - ../modules:/app/modules:ro
