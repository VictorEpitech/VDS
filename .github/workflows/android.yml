name: android
on:
  push:
    branches: [main]
    paths: ["packaging/android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["packaging/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du relais (JVM)
        run: ./gradlew :relay:test --console=plain
      - name: Débogage (sans secret)
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Signature (secrets du dépôt, jamais commités)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vds-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: APK de production signé
        if: steps.sign.outputs.signed == 'true'
        env:
          VDS_KEYSTORE_PATH: ${{ runner.temp }}/vds-release.jks
          VDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VDS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VDS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: vds-player-apk
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/release/*.apk
            packaging/android/app/build/outputs/apk/debug/*.apk
