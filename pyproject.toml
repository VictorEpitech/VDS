[project]
name = "vds"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["vds-server", "vds-agent", "vds-sdk"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "types-jsonschema>=4.26.0.20261006",
    "aiosmtpd>=1.4.6",
]

[tool.uv.workspace]
members = ["apps/server", "apps/site-agent", "packages/sdk-py"]

[tool.uv.sources]
vds-server = { workspace = true }
vds-agent = { workspace = true }
vds-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"modules/power.*/agent/**" = ["ASYNC109"]  # timeout borné explicite des protocoles TV
"modules/power.*/tests/**" = ["ASYNC109", "S105", "S110", "S112", "S303"]
"apps/site-agent/tests/**" = ["ASYNC109", "S105", "S110"]
"**/tests/test_[dpas]*.py" = ["F811"]  # fixtures importées de test_auth

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["apps/server/src", "apps/server/tests", "apps/site-agent/src", "packages/sdk-py/src"]
explicit_package_bases = true
files = ["apps/server/src", "apps/server/tests", "apps/site-agent/src", "packages/sdk-py/src", "packages/sdk-py/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/server/tests", "packages/sdk-py/tests", "apps/site-agent/tests", "modules"]
